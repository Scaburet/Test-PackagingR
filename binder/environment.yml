name: MEG-M1-A2B-2026-catalogueR
# Environnement « catalogue R » : MEG-M1-A2B-2026 (CVandiedonck/MEG-M1-A2B, binder/) + tous les paquets
# du catalogue PaquetsR-packaging-CataloguePaquetsR.
# Principe de fiabilité : TOUS les paquets R/Bioconductor viennent de conda (conda-forge + bioconda),
# aucun BiocManager::install() dans postBuild (évite les compilations source et le mélange de binaires
# conda / compilés localement : conflits libdeflate/htslib, ABI Rcpp, versions Bioc incohérentes).
# Seuls swirl et rehh (absents de conda) sont installés depuis CRAN par postBuild.
# r-base épinglé en 4.5 : les paquets Bioconductor de bioconda sont construits pour R 4.5 (Bioc 3.22).
# ensemblVEP exclu : retiré de Bioconductor 3.20, bioconda 1.44.0 exige R < 4.4.
# Tests : tests_R/run_all.R (scripts groupés par usage, mêmes groupes que ci-dessous)
# 21/10/2026

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Jupyter dependencies
  - jupyterhub>=4.1,<5
  - jupyterlab>=4.0,<5
  - notebook>=7,<8
  - jupyter_server>=2,<3
  - jupyter-server-proxy>=4.1,<4.2
  - jupyter-resource-usage
  - jupyterlab-topbar-text    # affiche le nom de l'environnement à droite dans la topbar
  - nodejs
  - nbresuse
  - libgomp

  # Jupyter archive
  # https://github.com/jupyterlab-contrib/jupyter-archive
  - jupyter-archive
  # JupyterLab git
  # https://github.com/jupyterlab/jupyterlab-git
  - jupyterlab-git

  # Bash environment
  - bash_kernel

  # RStudio proxy (nécessaire pour afficher RStudio dans JupyterLab)
  - jupyter-rsession-proxy==2.3.0

  # Python environment
  - python=3.10
  - pip
  - pip:
    - watermark

  # For the M1 A2B course (unix part)
  - fastqc
  - multiqc
  - fastp
  - star
  - salmon
  - samtools
  - qualimap
  - subread

  # R environment
  - r-irkernel
  - r-base=4.5
  - r-essentials
  - r-tidyverse
  - r-markdown
  - r-openxlsx
  - r-rpart
  - r-rpart.plot
  - r-biocmanager                 # pour les installations ponctuelles (ex. TP R7) ; donne Bioc 3.22 avec R 4.5
  - r-callr                       # utilisé par tests_R/ pour isoler chaque test
  - quarto                        # CLI Quarto requise par r-quarto
  - pandoc
  - r-textshaping>=1.0.5          # 1.0.4 : avertissement « compiled with different versions of Freetype » avec r-systemfonts 1.3.2


